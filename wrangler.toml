name = "t101-portal"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "t101-trabajadores"
database_id = "64afff63-bbb7-424d-8d25-1d440af2b840"
# Los cambios a la base (columnas nuevas) van en migrations/, uno por archivo.
# schema.sql solo sirve para crear lo que no existe todavía.
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "t101-documentos"

[vars]
EMPRESA = "Taller 101"
CORREO_REMITENTE = "Taller 101 <expedientes@envios.taller101.mx>"
CORREO_AVISOS = "mike@forespot.com"

# La empresa que está usando roster101. De aquí sale su nombre en TODAS partes:
# el aviso de privacidad, los correos que reciben sus trabajadores, los nombres
# de los archivos que se descargan, la ficha en PDF y el documento bancario que
# se firma. Montarle el portal a otro cliente es cambiar estas líneas, crear su
# base D1 y su bucket R2, y publicar con el token de Cloudflare de ese cliente.
RAZON_SOCIAL = "Taller 101"
DOMICILIO = "5 de Mayo 60, San Nicolás Totolapan, La Magdalena Contreras, C.P. 10900, Ciudad de México"
CORREO_PRIVACIDAD = "mike@forespot.com"
AVISO_VERSION = "2026-09-03"

# Versión del portal. Se ve arriba a la derecha en todas las pantallas; se sube
# aquí en cada publicación y es la que hay que preguntar cuando alguien reporta
# una falla, para saber qué estaba usando.
PORTAL_VERSION = "0.8.1"

# Barrido diario de la papelera: a las 4:00 UTC (10 u 11 de la noche en el centro
# de México, según el horario). Borra de verdad lo que ya cumplió 30 días.
[triggers]
crons = ["0 4 * * *"]
