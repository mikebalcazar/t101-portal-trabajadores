# Publica roster101 en Cloudflare cada vez que cambia el código.
#
# Cada empresa tiene su propio Worker (Mike, 19-sep: un Worker por empresa,
# como siempre); sus datos viven en SU base de la suite, así que aquí ya no se
# crea ninguna base ni ningún bucket ni se pone ningún secreto. La lista sale de
# los archivos de la carpeta clientes/ más el wrangler.toml de la raíz, que es
# el de Taller 101. Una empresa se da de alta en master101 y se le agrega su
# archivo en clientes/ (ver clientes/_plantilla.toml).
#
# Orden: pruebas → staging (empresa demo, contra la API de staging) → humo en
# staging (entrar y escribir de verdad) → producción, un Worker por empresa →
# medición de la puerta de Taller 101 desde afuera → verificación.
#
# Secreto del repositorio (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token con Workers Scripts:Edit, Account Settings:Read,
#                          User Details:Read
# RESEND_API_KEY y SECRETO ya no se usan aquí: el correo lo manda la suite y la
# cookie del trabajador la firma la suite.
name: Publicar portal

on:
  push:
    branches: [main]
    paths-ignore:
      - 'claude/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  # El cascarón, en una mesa de trabajo: con una suite de mentiras se comprueba
  # que reenvíe bien (ruta, empresa, cookies, datos de la empresa, cuerpo); y la
  # pantalla, con un navegador de verdad. Corre antes de publicar.
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prueba

  # Primero staging: mismo código, contra la API de staging y la empresa demo.
  # Ahí se entra y se escribe de verdad (el humo). Si eso no pasa, producción
  # no se toca.
  staging:
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publicar staging
        id: publicar
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging | tee /tmp/staging.txt
          liga=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/staging.txt | head -1)
          if [ -z "$liga" ]; then echo 'No pude sacar la liga de staging.' >&2; exit 1; fi
          echo "liga=$liga" >> "$GITHUB_OUTPUT"
      - name: Humo en staging (panel, trabajador, papelera)
        env:
          PORTAL: ${{ steps.publicar.outputs.liga }}
        run: |
          sleep 12
          node scripts/humo.mjs

  lista:
    needs: staging
    runs-on: ubuntu-latest
    outputs:
      clientes: ${{ steps.armar.outputs.clientes }}
    steps:
      - uses: actions/checkout@v4
      - id: armar
        run: |
          set -euo pipefail
          echo "clientes=$(node scripts/clientes.mjs)" >> "$GITHUB_OUTPUT"
          node scripts/clientes.mjs --tabla

  publicar:
    needs: lista
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # que una empresa con problema no tumbe a las demás
      matrix:
        cliente: ${{ fromJson(needs.lista.outputs.clientes) }}
    name: ${{ matrix.cliente.slug }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci

      - name: Publicar
        id: publicar
        run: |
          set -euo pipefail
          npx wrangler deploy -c "${{ matrix.cliente.config }}" | tee /tmp/salida.txt
          liga=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/salida.txt | head -1)
          if [ -z "$liga" ]; then echo 'No pude sacar la liga del portal de la salida de wrangler.' >&2; exit 1; fi
          # El portal de Taller 101 se mide en su dominio: su workers.dev manda
          # para allá desde el 25-sep (DOMINIO_PROPIO en wrangler.toml).
          if [ "${{ matrix.cliente.raiz }}" = "true" ]; then liga=https://roster101.taller101.com; fi
          echo "liga=$liga" >> "$GITHUB_OUTPUT"
          echo "Publicado en $liga"

      # La puerta, medida desde afuera. Sólo en el portal de Taller 101: es el
      # que tiene gente de verdad, y aquí no se entra ni se escribe.
      - name: Medir la puerta del panel
        id: medir
        if: ${{ matrix.cliente.raiz }}
        continue-on-error: true
        run: |
          set -o pipefail
          sleep 12
          PORTAL="${{ steps.publicar.outputs.liga }}" node scripts/medir-puerta.mjs 2>&1 | tee /tmp/medicion.txt

      - name: Dejar la medición en el commit
        if: ${{ matrix.cliente.raiz }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          [ -f /tmp/medicion.txt ] || echo "No hubo medición que reportar." > /tmp/medicion.txt
          jq -Rs '{body: ("**Medicion de la puerta del panel**\n\n```\n" + .[-60000:] + "\n```")}' \
            /tmp/medicion.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /dev/null -w 'comentario: %{http_code}\n'

      - name: La medición tenía que salir verde
        if: ${{ matrix.cliente.raiz && steps.medir.outcome == 'failure' }}
        run: exit 1

      - name: Revisar que el portal responda
        run: |
          set -euo pipefail
          sleep 12
          curl -fsS "${{ steps.publicar.outputs.liga }}/api/salud"
          echo

  # El chat no alcanza producción; el corredor sí. Deja los números medidos
  # como comentario del commit, que es lo único que el chat puede leer.
  verificar:
    needs: publicar
    uses: ./.github/workflows/verificar.yml
    with:
      url: https://t101-portal.mike-929.workers.dev
      rutas: /api/salud
