# Alta de una empresa en roster101.
#
# Le crea su base D1, su bucket R2 y su propio Worker, deja el archivo del
# cliente en clientes/ para que de aqui en adelante se publique solo con los
# demas, y le manda por correo sus ligas y la clave de su panel.
#
# Se dispara a mano: Actions -> Alta de cliente -> Run workflow.
# Viene en simulacro por default: la primera corrida solo dice que haria.
name: Alta de cliente

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Nombre corto, sin acentos ni espacios (ej. constructora-lopez). Asi se van a llamar su Worker y su base.'
        required: true
      empresa:
        description: 'Nombre corto de la empresa, el que ve su gente (ej. Constructora López)'
        required: true
      razon_social:
        description: 'Razon social completa'
        required: true
      domicilio:
        description: 'Domicilio fiscal completo'
        required: true
      correo_privacidad:
        description: 'Correo para asuntos de datos personales'
        required: true
      correo_avisos:
        description: 'Correo que recibe el aviso cuando alguien guarda su expediente'
        required: true
      correo_contacto:
        description: 'A donde se mandan las ligas y la clave del panel'
        required: true
      simulacro:
        description: 'Solo decir que haria, sin crear nada'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alta-cliente
  cancel-in-progress: false

jobs:
  alta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el nombre corto
        run: |
          set -euo pipefail
          slug='${{ inputs.slug }}'
          if ! printf '%s' "$slug" | grep -qE '^[a-z0-9]([a-z0-9-]{1,30}[a-z0-9])$'; then
            echo "El nombre corto solo lleva minusculas, numeros y guiones: '$slug' no sirve." >&2
            exit 1
          fi
          if [ -f "clientes/$slug.toml" ]; then
            echo "Ya existe clientes/$slug.toml: esa empresa ya esta dada de alta." >&2
            exit 1
          fi
          echo "Nombre corto valido: $slug"

      - name: Que se va a hacer
        run: |
          slug='${{ inputs.slug }}'
          cat <<FIN
          Se va a dar de alta a '${{ inputs.empresa }}':
            Worker  roster101-$slug
            Base    roster101-$slug
            Bucket  roster101-$slug-docs
            Archivo clientes/$slug.toml
            Correo  a ${{ inputs.correo_contacto }} con sus ligas y su clave
          FIN
          if [ '${{ inputs.simulacro }}' = 'true' ]; then
            echo ''
            echo 'SIMULACRO: hasta aqui llega. Para hacerlo de verdad, vuelve a correr el flujo con simulacro apagado.'
          fi

      - name: Crear la base de datos
        if: ${{ inputs.simulacro == false }}
        id: base
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          nombre='roster101-${{ inputs.slug }}'
          # Si ya existiera de un intento anterior, se reusa en vez de fallar.
          salida=$(npx wrangler d1 create "$nombre" 2>&1 || npx wrangler d1 info "$nombre" 2>&1)
          echo "$salida"
          id=$(printf '%s' "$salida" | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$id" ]; then echo 'No pude sacar el identificador de la base.' >&2; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Base $nombre lista"

      - name: Crear el bucket de documentos
        if: ${{ inputs.simulacro == false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket create "roster101-${{ inputs.slug }}-docs" || echo 'El bucket ya existia; se reusa.'

      - name: Escribir el archivo del cliente
        if: ${{ inputs.simulacro == false }}
        env:
          SLUG: ${{ inputs.slug }}
          BASE_ID: ${{ steps.base.outputs.id }}
          EMPRESA: ${{ inputs.empresa }}
          RAZON_SOCIAL: ${{ inputs.razon_social }}
          DOMICILIO: ${{ inputs.domicilio }}
          CORREO_PRIVACIDAD: ${{ inputs.correo_privacidad }}
          CORREO_AVISOS: ${{ inputs.correo_avisos }}
        run: node scripts/alta-cliente.mjs

      - name: Aplicar el esquema y los cambios a la base
        if: ${{ inputs.simulacro == false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          config="clientes/${{ inputs.slug }}.toml"
          npx wrangler d1 execute "roster101-${{ inputs.slug }}" --remote --file=./schema.sql --yes -c "$config"
          npx wrangler d1 migrations apply "roster101-${{ inputs.slug }}" --remote -c "$config"

      - name: Publicar su portal
        if: ${{ inputs.simulacro == false }}
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy -c "clientes/${{ inputs.slug }}.toml" | tee /tmp/salida.txt
          liga=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/salida.txt | head -1)
          if [ -z "$liga" ]; then echo 'No pude sacar la liga del portal.' >&2; exit 1; fi
          echo "liga=$liga" >> "$GITHUB_OUTPUT"

      - name: Poner sus secretos
        if: ${{ inputs.simulacro == false }}
        id: secretos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          config="clientes/${{ inputs.slug }}.toml"
          # Cada empresa tiene su propia firma de sesiones y su propia clave de
          # panel. Se generan aqui, se guardan solo en su Worker y la clave se le
          # manda por correo: no quedan en el repositorio ni en la bitacora.
          secreto=$(openssl rand -base64 48 | tr -d '\n/+=' | cut -c1-40)
          clave=$(openssl rand -base64 24 | tr -d '\n/+=' | cut -c1-14)
          echo "::add-mask::$secreto"
          echo "::add-mask::$clave"
          printf '%s' "$secreto"         | npx wrangler secret put SECRETO        -c "$config"
          printf '%s' "$clave"           | npx wrangler secret put CLAVE_ADMIN    -c "$config"
          printf '%s' "$RESEND_API_KEY"  | npx wrangler secret put RESEND_API_KEY -c "$config"
          echo "clave=$clave" >> "$GITHUB_OUTPUT"

      - name: Comprobar que su portal responde
        if: ${{ inputs.simulacro == false }}
        run: |
          set -euo pipefail
          sleep 12
          curl -fsS "${{ steps.publicar.outputs.liga }}/api/salud"

      - name: Mandarle sus accesos por correo
        if: ${{ inputs.simulacro == false }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CORREO_CONTACTO: ${{ inputs.correo_contacto }}
          EMPRESA: ${{ inputs.empresa }}
          LIGA_PORTAL: ${{ steps.publicar.outputs.liga }}
          CLAVE_ADMIN: ${{ steps.secretos.outputs.clave }}
        run: node scripts/correo-alta.mjs

      - name: Guardar el alta en el repositorio
        if: ${{ inputs.simulacro == false }}
        run: |
          set -euo pipefail
          git config user.name 'roster101 (alta de cliente)'
          git config user.email 'actions@github.com'
          git add "clientes/${{ inputs.slug }}.toml"
          git commit -m "Alta de cliente: ${{ inputs.empresa }}

          Su Worker, su base y su bucket quedaron creados; este archivo hace que
          de aqui en adelante se publique junto con los demas clientes."
          git push

      - name: Resumen
        if: ${{ inputs.simulacro == false }}
        run: |
          {
            echo "## ${{ inputs.empresa }} dada de alta"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Portal | ${{ steps.publicar.outputs.liga }} |"
            echo "| Panel | ${{ steps.publicar.outputs.liga }}/admin |"
            echo "| Archivo | clientes/${{ inputs.slug }}.toml |"
            echo ""
            echo "La clave del panel se le mando por correo a ${{ inputs.correo_contacto }}. No queda escrita aqui."
          } >> "$GITHUB_STEP_SUMMARY"
