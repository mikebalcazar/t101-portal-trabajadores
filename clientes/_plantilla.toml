# Plantilla de cliente de roster101.
#
# Cada cliente tiene su propio Worker, su propia base D1 y su propio bucket R2:
# los datos de una empresa no se cruzan con los de otra ni por descuido de una
# consulta. Este archivo es todo lo que define a un cliente; lo genera solo el
# flujo "Alta de cliente" de GitHub Actions, y de ahí en adelante el despliegue
# lo publica junto con los demás.
#
# Las rutas son relativas a esta carpeta: el código vive un nivel arriba.
name = "roster101-PLANTILLA"
main = "../src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "roster101-PLANTILLA"
database_id = "PONER-EL-ID-QUE-DEVUELVE-D1-CREATE"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "roster101-PLANTILLA-docs"

# De aquí sale el nombre de la empresa en todo lo que ve su gente: el aviso de
# privacidad, los correos, los archivos que se descargan y el documento bancario
# que se firma.
[vars]
EMPRESA = "Nombre corto de la empresa"
RAZON_SOCIAL = "Razón social completa"
DOMICILIO = "Domicilio fiscal completo"
CORREO_PRIVACIDAD = "privacidad@empresa.mx"
CORREO_REMITENTE = "Nombre corto <expedientes@envios.taller101.mx>"
CORREO_AVISOS = "quien-recibe-los-avisos@empresa.mx"
AVISO_VERSION = "2026-09-03"
PORTAL_VERSION = "0.11.0"

# Barrido diario de la papelera, 4:00 UTC.
[triggers]
crons = ["0 4 * * *"]
