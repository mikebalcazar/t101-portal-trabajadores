# Plantilla de cliente de roster101.
#
# Cada empresa tiene su propio Worker (Mike, 19-sep: un Worker por empresa,
# como siempre). Sus datos viven en SU base de la suite: este archivo sólo dice
# qué empresa de la suite es (ORG_ID) y cómo se llama en lo que ve su gente.
#
# Cómo se da de alta una empresa desde el 19-sep (la central se retiró):
#   1. En master101: alta de la empresa, con roster101 prendida entre sus apps.
#   2. Copiar este archivo a clientes/<nombre-corto>.toml con su ORG_ID y sus
#      datos, y mandarlo a main: el despliegue publica su Worker junto con los
#      demás. No hay base ni bucket que crear, ni secretos que poner.
#   3. El dueño o la administración de la empresa abre /admin.html con su cuenta
#      de la suite: entra como dueño del panel y da de alta a su gente.
#
# Las rutas son relativas a esta carpeta: el código vive un nivel arriba.
name = "roster101-PLANTILLA"
main = "../src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/s101/*"]

# La suite, desde el mismo origen. Es por donde entra todo: el panel con su
# cuenta de la suite y el trabajador con su correo y su código.
[[services]]
binding = "API"
service = "suite101-api"

[vars]
# El id de la empresa en la suite (el mismo que en master101).
ORG_ID = "nombre-corto-de-la-empresa"

# De aquí sale el nombre de la empresa en todo lo que ve su gente: el aviso de
# privacidad, los correos, los archivos que se descargan y el documento bancario
# que se firma.
EMPRESA = "Nombre corto de la empresa"
RAZON_SOCIAL = "Razón social completa"
DOMICILIO = "Domicilio fiscal completo"
CORREO_PRIVACIDAD = "privacidad@empresa.mx"
CORREO_REMITENTE = "Nombre corto <expedientes@envios.taller101.mx>"
CORREO_AVISOS = "quien-recibe-los-avisos@empresa.mx"
AVISO_VERSION = "2026-09-03"
PORTAL_VERSION = "0.13.1"
